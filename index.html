    <style>
        :root {
            --bg: #f5f3ee;
            --surface: #faf9f6;
            --surface2: #efede8;
            --border: rgba(0, 0, 0, 0.1);
            --border-strong: rgba(0, 0, 0, 0.18);
            --text: #1a1915;
            --text-2: #6b6a64;
            --text-3: #9b9a94;
            --accent: #2a4a2e;
            --accent-light: #d4e8d5;
            --red: #8b2020;
            --red-bg: #fdecea;
            --amber: #7a4a0a;
            --amber-bg: #fdf3e0;
            --green: #1a5c2a;
            --green-bg: #e4f5e8;
            --blue: #1a3a6b;
            --blue-bg: #e4ecf8;
            --radius: 6px;
            --radius-lg: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* Layout */
        .shell {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .main {
            flex: 1;
            padding: 2.5rem 2.5rem 4rem;
            max-width: 1400px;
        }

        /* The semester calendar uses the full width; the timeline stays readable */
        #timeline-view { max-width: 860px; }

        /* Sidebar */
        .sidebar-header {
            padding: 1.75rem 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 3px;
        }

        .sidebar-title em {
            font-style: italic;
            color: var(--text-2);
        }

        .sidebar-sub {
            font-size: 11px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-section {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }

        .cal-url-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .cal-url-row input {
            flex: 1;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            padding: 6px 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        .cal-url-row input:focus {
            border-color: var(--border-strong);
        }

        .cal-url-row input::placeholder {
            color: var(--text-3);
        }

        .btn-rm {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3);
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            flex-shrink: 0;
            font-size: 14px;
            transition: background 0.1s, color 0.1s;
        }

        .btn-rm:hover {
            background: var(--red-bg);
            color: var(--red);
        }

        .cal-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .btn-add-cal {
            width: 100%;
            padding: 6px;
            font-size: 12px;
            background: none;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-2);
            margin-top: 4px;
            transition: background 0.1s;
        }

        .btn-add-cal:hover {
            background: var(--surface2);
        }

        .preset-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .preset-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            background: none;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-2);
            transition: background 0.1s, color 0.1s;
        }

        .preset-btn:hover:not(:disabled) {
            background: var(--surface2);
        }

        .preset-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .preset-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-load {
            width: 100%;
            padding: 9px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: opacity 0.15s;
            margin-top: 4px;
        }

        .btn-load:hover {
            opacity: 0.88;
        }

        .btn-load:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: var(--radius);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-2);
            transition: background 0.1s;
            text-align: left;
        }

        .filter-btn:hover {
            background: var(--surface2);
        }

        .filter-btn.active {
            background: var(--surface2);
            color: var(--text);
            font-weight: 500;
        }

        .filter-count {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            background: var(--surface2);
            color: var(--text-3);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .filter-btn.active .filter-count {
            background: var(--border-strong);
            color: var(--text);
        }

        .cal-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cal-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 3px 6px;
            margin: 0 -6px;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-2);
            background: none;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            transition: background 0.1s, opacity 0.1s;
        }

        .cal-legend-item:hover { background: var(--surface2); }

        .cal-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .cal-legend-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Hidden course: hollow dot, struck-through name */
        .cal-legend-item.is-hidden { opacity: 0.5; }
        .cal-legend-item.is-hidden .cal-legend-dot { background: none !important; }
        .cal-legend-item.is-hidden .cal-legend-name { text-decoration: line-through; }

        .cal-legend-all {
            margin-top: 6px;
            padding: 0;
            font-size: 11px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 1rem 1.5rem;
        }

        .refresh-info {
            font-size: 11px;
            color: var(--text-3);
        }

        /* Main content */
        .page-title {
            font-family: 'Instrument Serif', serif;
            font-size: 2.5rem;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 2rem;
            text-align: left;
            letter-spacing: 0.05em;
        }

        .page-title em {
            font-style: italic;
        }


        /* Stats row */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem 1.1rem;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            line-height: 1;
            color: var(--text);
        }

        .stat-value.red {
            color: var(--red);
        }

        .stat-value.amber {
            color: var(--amber);
        }

        .stat-value.green {
            color: var(--green);
        }

        /* Timeline */
        .day-group {
            margin-bottom: 1.75rem;
        }

        .day-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .day-today-pill {
            background: var(--accent);
            color: #fff;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 2px 7px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .event-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 6px;
            transition: border-color 0.15s, box-shadow 0.15s;
            cursor: default;
        }

        .event-card:hover {
            border-color: var(--border-strong);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }


        .urgency-bar {
            width: 3px;
            height: 36px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .event-body {
            flex: 1;
            min-width: 0;
        }

        .event-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .badge-overdue {
            background: var(--red-bg);
            color: var(--red);
        }

        .badge-today {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .badge-soon {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .badge-upcoming {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge-later {
            background: var(--surface2);
            color: var(--text-2);
        }

        .bar-overdue {
            background: var(--red);
        }

        .bar-today {
            background: #e08a00;
        }

        .bar-soon {
            background: #c47600;
        }

        .bar-upcoming {
            background: var(--green);
        }

        .bar-later {
            background: #b0afa9;
        }

        .cal-chip {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid;
            font-family: 'DM Sans', sans-serif;
            background: transparent;
            font-weight: 400;
        }

        .event-time {
            font-size: 11px;
            color: var(--text-3);
            font-family: 'DM Mono', monospace;
        }

        .event-desc {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 5px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-location {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
        }

        .event-timeline {
            font-size: 11px;
            color: var(--text-2);
            margin-top: 5px;
            padding: 4px 8px;
            background: var(--surface2);
            border-left: 2px solid var(--accent);
            border-radius: 3px;
        }

        /* States */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-3);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-title {
            font-family: 'Instrument Serif', serif;
            font-size: 22px;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .empty-sub {
            font-size: 13px;
        }

        .status-bar {
            font-size: 12px;
            color: var(--text-2);
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-err {
            font-size: 12px;
            color: var(--red);
            background: var(--red-bg);
            padding: 8px 12px;
            border-radius: var(--radius);
            margin-top: 8px;
            border-left: 3px solid var(--red);
        }

        .spinner {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Staggered entry animation */
        .event-card {
            animation: fadeUp 0.2s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-card:nth-child(1) {
            animation-delay: 0.02s;
        }

        .event-card:nth-child(2) {
            animation-delay: 0.04s;
        }

        .event-card:nth-child(3) {
            animation-delay: 0.06s;
        }

        .event-card:nth-child(4) {
            animation-delay: 0.08s;
        }

        .event-card:nth-child(5) {
            animation-delay: 0.10s;
        }

        /* View tabs */
        .view-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--border);
        }

        .view-tab {
            padding: 7px 16px;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            background: none;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-2);
            cursor: pointer;
            transition: color 0.15s;
        }

        .view-tab:hover { color: var(--text); }

        .view-tab.active {
            color: var(--text);
            font-weight: 500;
            border-bottom-color: var(--accent);
        }

        /* Workload view: Gantt chart drawn with D3 into #workload-content (see renderWorkload) */
        #workload-view {
            max-width: 100%;
            padding: 0;
        }

        #workload-content > .wl-head {
            position: sticky; top: 0; z-index: 2;
            display: flex; width: max-content;
            background: var(--surface);
        }
        #workload-content .wl-corner {
            position: sticky; left: 0; z-index: 3;
            flex: none; background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        #workload-content > .wl-body { display: flex; width: max-content; }
        #workload-content .wl-labels {
            position: sticky; left: 0; z-index: 1;
            flex: none; background: var(--surface);
        }
        #workload-content svg { display: block; flex: none; }

        /* Semester grid */
        .sem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem 2.5rem;
            margin-bottom: 1.5rem;
        }

        .sem-month-title {
            font-family: 'Instrument Serif', serif;
            font-size: 19px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .sem-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 3px;
        }

        .sem-wd {
            font-size: 10px;
            text-align: center;
            color: var(--text-3);
            font-weight: 500;
            letter-spacing: 0.04em;
            padding: 2px 0;
        }

        .sem-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .sem-day {
            aspect-ratio: 1;
            min-height: 0; /* large workload dots may overflow instead of stretching the row */
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 4px;
            font-size: 12px;
            color: var(--text-3);
            transition: background 0.1s;
        }

        .sem-day.has-events { cursor: pointer; color: var(--text); }
        .sem-day.has-events:hover { background: var(--surface2); }
        .sem-day.is-today { background: var(--accent-light); color: var(--accent); font-weight: 700; }
        .sem-day.is-overdue { background: var(--red-bg); }
        .sem-day.is-selected { outline: 2px solid var(--accent); outline-offset: -1px; }

        .sem-day-num { line-height: 1; }

        /* Dots share one fixed area below the day number and overlap instead of wrapping */
        .sem-dots {
            position: relative;
            flex: 1;
            width: 100%;
        }

        .sem-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            opacity: 0.7;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .sem-day:hover .sem-dot { opacity: 0.9; }

        /* Student effort estimates */
        .effort {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 11px;
            color: var(--text-2);
        }

        .effort-q { margin-bottom: 4px; }

        .effort-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .effort-btn {
            padding: 2px 8px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            background: none;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            color: var(--text-2);
            cursor: pointer;
            transition: background 0.1s;
        }

        .effort-btn:hover { background: var(--surface2); }

        .effort-btn.mine {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .effort-stats {
            margin-top: 5px;
            color: var(--text-3);
        }

        .effort-stats strong { color: var(--text); font-weight: 500; }

        .effort-specific {
            margin-top: 8px;
            font-size: 11px;
        }

        .effort-specific label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-2);
        }

        .effort-input {
            width: 60px;
            padding: 4px 6px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            background: var(--surface2);
            color: var(--text);
        }

        .effort-input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }

        .start-date {
            margin-top: 8px;
            font-size: 11px;
        }

        .start-date label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-2);
        }

        .start-date-input {
            padding: 4px 6px;
            font-size: 11px;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            background: var(--surface2);
            color: var(--text);
        }

        .start-date-input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }

        .start-date-display {
            font-weight: 500;
            color: var(--accent);
        }

        /* Day modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.5rem 1rem;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3);
            font-size: 15px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.1s, color 0.1s;
        }

        .modal-close:hover { background: var(--surface2); color: var(--text); }

        .modal-title {
            font-family: 'Instrument Serif', serif;
            font-size: 18px;
            color: var(--text);
            margin-bottom: 1rem;
            padding-right: 2rem;
        }

        /* Year navigation */
        .year-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 3px;
        }

        .year-nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-2);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, color 0.1s;
        }

        .year-nav-btn:hover { background: var(--surface); color: var(--text); }

        .year-nav-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            font-family: 'DM Mono', monospace;
        }

        @media (max-width: 800px) {
            .shell {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .main {
                padding: 1.5rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <div class="shell">

        <!-- Sidebar -->
        <aside class="sidebar" role="complementary" aria-label="Calendar configuration">
            <div class="sidebar-header">
                <div class="sidebar-title">Deadline<br /><em>Dashboard</em></div>
                <div class="sidebar-sub">ICS Calendar Aggregator</div>
            </div>

            <div class="sidebar-section" id="preset-section" style="display:none">
                <div class="sidebar-section-label">Programme year</div>
                <div class="preset-list" id="preset-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-label">Calendar feeds</div>
                <div id="url-list"></div>
                <button class="btn-add-cal" onclick="switchToCustom(); addRow()">+ add calendar</button>
            </div>

            <div class="sidebar-section">
                <button class="btn-load" id="load-btn" onclick="loadAll()">Load calendars</button>
                <div id="load-status"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-label">Filter</div>
                <div class="filter-list" id="filter-list"></div>
            </div>

            <div class="sidebar-section" id="year-nav-section" style="display:none">
                <div class="sidebar-section-label">Academic year</div>
                <div class="year-nav">
                    <button class="year-nav-btn" onclick="shiftYear(-1)" title="Previous year">←</button>
                    <span class="year-nav-label" id="year-nav-label"></span>
                    <button class="year-nav-btn" onclick="shiftYear(1)" title="Next year">→</button>
                </div>
            </div>

            <div class="sidebar-section" id="legend-section" style="display:none">
                <div class="sidebar-section-label">Calendars</div>
                <div class="cal-legend" id="cal-legend"></div>
            </div>

            <div class="sidebar-footer">
                <div class="refresh-info" id="refresh-info"></div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main" role="main">
            <div class="page-title" id="page-title"></div>

            <div class="view-tabs" id="view-tabs" style="display:none">
                <button class="view-tab active" id="tab-semester" onclick="setView('semester')">Semester</button>
                <button class="view-tab" id="tab-timeline" onclick="setView('timeline')">Timeline</button>
                <button class="view-tab" id="tab-workload" onclick="setView('workload')">Workload</button>
            </div>

            <div id="timeline-view" style="display:none">
                <div class="stats" id="stats" style="display:none"></div>
                <div id="content">
                    <div class="empty-state">
                        <div class="empty-icon">🗓</div>
                        <div class="empty-title">No calendars loaded yet</div>
                        <div class="empty-sub">Add ICS feed URLs in the sidebar and click "Load calendars"</div>
                    </div>
                </div>
            </div>

            <div id="workload-view" style="display:none">
                <div id="workload-content"></div>
            </div>

            <div id="semester-view">
                <div id="semester-grid"></div>
            </div>
        </main>
    </div>

    <script>
        // All data (presets, feeds, estimates, start dates) goes through the Supabase Edge Function
        const API = 'https://twhrfteqfobetvrjfrsj.supabase.co/functions/v1/deadlines';

        // 14 clearly different hues, ordered so neighbouring courses contrast most
        const CAL_COLORS = [
            '#2563eb', '#dc2626', '#16a34a', '#ea580c', '#9333ea', '#0891b2', '#db2777',
            '#65a30d', '#92400e', '#1e3a8a', '#c026d3', '#0f766e', '#ca8a04', '#475569'
        ];

        let allEvents = [];
        let calMeta = [];
        // Courses hidden via the legend, by feed URL; remembered per browser
        let hiddenCals = new Set((() => { try { return JSON.parse(localStorage.getItem('io-hidden-cals')) || []; } catch { return []; } })());
        let activeFilter = 'all';
        let colorIdx = 0;
        let currentView = 'semester';
        let yearOffset = 0;
        let presets = [];
        let activePreset = null;
        let efforts = {}; // taskId → { before: { counts, mine, specificHours }, after: { counts, mine, specificHours } }
        let startDates = {}; // taskId → { startDate, votes }
        let workloadEventsCache = []; // Rows of the workload chart (merged, sorted by deadline)

        // Hour ranges students can pick; `mid` is used to compute an average
        const EFFORT_BUCKETS = [
            { label: '<1h', mid: 0.5 },
            { label: '1–3h', mid: 2 },
            { label: '3–8h', mid: 5.5 },
            { label: '8–20h', mid: 14 },
            { label: '20h+', mid: 25 },
        ];

        // Anonymous per-browser id, so a student can change their own answer
        const voterId = (() => {
            try {
                let id = localStorage.getItem('io-voter-id');
                if (!id) { id = crypto.randomUUID(); localStorage.setItem('io-voter-id', id); }
                return id;
            } catch { return crypto.randomUUID(); }
        })();

        function getAcademicYear() {
            const now = new Date(), m = now.getMonth() + 1;
            return (m >= 8 ? now.getFullYear() : now.getFullYear() - 1) + yearOffset;
        }

        function eventsInYear() {
            const y = getAcademicYear();
            const start = new Date(y, 8, 1);
            const end = new Date(y + 1, 7, 31, 23, 59, 59);
            return visibleEvents().filter(e => { const d = new Date(e.date); return d >= start && d <= end; });
        }

        function visibleEvents() {
            return allEvents.filter(e => !hiddenCals.has(e.calUrl));
        }

        function toggleCal(url) {
            hiddenCals.has(url) ? hiddenCals.delete(url) : hiddenCals.add(url);
            saveHiddenCals();
        }

        function showAllCals() {
            calMeta.forEach(c => hiddenCals.delete(c.url));
            saveHiddenCals();
        }

        function saveHiddenCals() {
            try { localStorage.setItem('io-hidden-cals', JSON.stringify([...hiddenCals])); } catch { }
            renderAll();
        }

        // ── Init ──────────────────────────────────────────────────────────────────

        (async () => {
            presets = await fetch(API + '/presets').then(r => r.json()).catch(() => []);
            renderPresets();
            renderFilters();
            document.getElementById('url-list').addEventListener('input', switchToCustom);

            const requested = new URLSearchParams(location.search).get('set');
            const preset = presets.find(p => p.name === requested && p.urls.length);
            if (preset) selectPreset(preset.name);
            else await restoreCustom();
        })();

        // ── Presets ───────────────────────────────────────────────────────────────
        // A custom list is kept in this browser only: feed URLs carry personal tokens
        function loadCustom() {
            try { return JSON.parse(localStorage.getItem('io-custom-cals')) || []; } catch { return []; }
        }

        function saveCustom(calendars) {
            localStorage.setItem('io-custom-cals', JSON.stringify(calendars));
        }

        function restoreCustom() {
            const saved = loadCustom();
            clearRows();
            if (saved.length) saved.forEach(c => addRow(c.url));
            else addRow();
        }

        function renderPresets() {
            document.getElementById('preset-section').style.display = presets.length ? '' : 'none';
            const btn = (label, onclick, active, disabled, title = '') =>
                `<button class="preset-btn ${active ? 'active' : ''}" onclick="${onclick}" ${disabled ? 'disabled' : ''} title="${esc(title)}">${esc(label)}</button>`;
            document.getElementById('preset-list').innerHTML =
                presets.map(p => btn(p.name, `selectPreset('${esc(p.name)}')`, activePreset === p.name,
                    !p.urls.length, p.urls.length ? `${p.urls.length} calendar(s)` : 'No calendars configured')).join('') +
                btn('Custom', 'selectCustom()', activePreset === null, false, 'Your own list of feeds');
        }

        function selectPreset(name) {
            const preset = presets.find(p => p.name === name);
            if (!preset || !preset.urls.length) return;
            activePreset = name;
            clearRows();
            preset.urls.forEach(u => addRow(u));
            history.replaceState(null, '', '?set=' + encodeURIComponent(name));
            renderPresets();
            loadAll();
        }

        async function selectCustom() {
            if (activePreset === null) return;
            switchToCustom();
            await restoreCustom();
        }

        // Editing the feed list turns a preset into a custom list
        function switchToCustom() {
            if (activePreset === null) return;
            activePreset = null;
            history.replaceState(null, '', location.pathname);
            renderPresets();
        }

        // ── URL management ────────────────────────────────────────────────────────
        function clearRows() {
            document.getElementById('url-list').innerHTML = '';
            colorIdx = 0;
        }

        function addRow(val = '') {
            const list = document.getElementById('url-list');
            const id = 'r' + Date.now() + Math.random();
            const n = list.children.length + 1;
            const color = CAL_COLORS[colorIdx % CAL_COLORS.length];
            colorIdx++;
            const d = document.createElement('div');
            d.className = 'cal-url-row'; d.id = id; d.dataset.color = color;
            d.innerHTML = `
    <span class="cal-dot" style="background:${color}"></span>
    <input type="text" placeholder="https://…/feed.ics" value="${esc(val)}" spellcheck="false" />
    <button class="btn-rm" onclick="rmRow('${id}')" aria-label="Remove calendar" title="Remove">✕</button>
  `;
            list.appendChild(d);
        }

        function rmRow(id) {
            document.getElementById(id)?.remove();
            switchToCustom();
        }

        function getCalInputs() {
            return [...document.querySelectorAll('.cal-url-row')].map(r => ({
                url: r.querySelector('input').value.trim(),
                color: r.dataset.color
            })).filter(c => c.url);
        }

        // ── Fetch ─────────────────────────────────────────────────────────────────
        async function loadAll() {
            const inputs = getCalInputs();
            if (!inputs.length) { setStatus('Add at least one ICS URL.', true); return; }

            allEvents = []; calMeta = [];
            const btn = document.getElementById('load-btn');
            btn.disabled = true;
            document.getElementById('stats').style.display = 'none';
            setStatus('<span><span class="spinner">⟳</span> Fetching…</span>');

            // Only a custom list is persisted; presets live in presets.yaml
            if (activePreset === null) try { saveCustom(inputs); } catch { }

            try {
                const res = await fetch(API + '/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: inputs.map(c => ({ url: c.url, color: c.color })) })
                });
                const results = await res.json();

                const errors = [];
                results.forEach((r, i) => {
                    const color = inputs[i]?.color || CAL_COLORS[i % CAL_COLORS.length];
                    if (r.error) { errors.push(`${r.name}: ${r.error}`); return; }
                    calMeta.push({ name: r.name, color, url: r.url });
                    r.events.forEach(e => allEvents.push({ ...e, calName: r.name, calUrl: r.url, color }));
                });

                allEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

                if (!allEvents.length && errors.length) {
                    setStatus(`Failed to load. ${errors[0]}`, true);
                } else {
                    const errNote = errors.length ? `<div class="status-err">⚠ ${errors.join(' · ')}</div>` : '';
                    document.getElementById('load-status').innerHTML = errNote;
                    const t = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('refresh-info').textContent = `Last loaded at ${t}`;
                }

                activeFilter = 'all';
                await loadEfforts();
                await loadStartDates();
                renderAll();
            } catch (e) {
                setStatus('Server error: ' + e.message, true);
            }

            btn.disabled = false;
        }

        // ── Render ────────────────────────────────────────────────────────────────
        function urgency(dateStr) {
            const now = new Date(); now.setHours(0, 0, 0, 0);
            const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
            const diff = Math.round((d - now) / 86400000);
            if (diff < 0) return { label: 'Overdue', cls: 'overdue', diff };
            if (diff === 0) return { label: 'Today', cls: 'today', diff };
            if (diff <= 3) return { label: `In ${diff}d`, cls: 'soon', diff };
            if (diff <= 14) return { label: `In ${diff}d`, cls: 'upcoming', diff };
            return { label: `In ${diff}d`, cls: 'later', diff };
        }

        function filterEvents(events) {
            const now = new Date(); now.setHours(0, 0, 0, 0);
            const ts = e => { const d = new Date(e.date); d.setHours(0, 0, 0, 0); return d.getTime(); };
            if (activeFilter === 'overdue') return events.filter(e => ts(e) < now.getTime());
            if (activeFilter === 'today') return events.filter(e => ts(e) === now.getTime());
            if (activeFilter === 'soon') return events.filter(e => { const d = Math.round((ts(e) - now.getTime()) / 86400000); return d > 0 && d <= 3; });
            if (activeFilter === 'upcoming') return events.filter(e => { const d = Math.round((ts(e) - now.getTime()) / 86400000); return d > 0 && d <= 14; });
            if (activeFilter === 'later') return events.filter(e => Math.round((ts(e) - now.getTime()) / 86400000) > 14);
            return events;
        }

        function countBy(cls) {
            const pool = eventsInYear();
            const now = new Date(); now.setHours(0, 0, 0, 0);
            const ts = e => { const d = new Date(e.date); d.setHours(0, 0, 0, 0); return d.getTime(); };
            if (cls === 'all') return pool.length;
            if (cls === 'overdue') return pool.filter(e => ts(e) < now.getTime()).length;
            if (cls === 'today') return pool.filter(e => ts(e) === now.getTime()).length;
            if (cls === 'soon') return pool.filter(e => { const d = Math.round((ts(e) - now.getTime()) / 86400000); return d > 0 && d <= 3; }).length;
            if (cls === 'upcoming') return pool.filter(e => { const d = Math.round((ts(e) - now.getTime()) / 86400000); return d > 0 && d <= 14; }).length;
            if (cls === 'later') return pool.filter(e => Math.round((ts(e) - now.getTime()) / 86400000) > 14).length;
            return 0;
        }

        function renderAll() {
            document.getElementById('view-tabs').style.display = 'flex';
            renderPageTitle();
            renderYearNav();
            renderStats();
            renderFilters();
            renderLegend();
            if (currentView === 'timeline') renderTimeline();
            else if (currentView === 'workload') renderWorkload();
            else renderSemester();
        }

        function renderPageTitle() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('en-US', options);

        function renderStats() {

            const ov = pool.filter(e => ts(e) < now.getTime()).length;
            const td = pool.filter(e => ts(e) === now.getTime()).length;
            const sw = pool.filter(e => { const d = Math.round((ts(e) - now.getTime()) / 86400000); return d > 0 && d <= 7; }).length;

            const el = document.getElementById('stats');
            el.style.display = 'grid';

    <div class="stat"><div class="stat-label">This week</div><div class="stat-value green">${sw}</div></div>

        function renderTimeline() {
            const events = filterEvents(eventsInYear());
            const content = document.getElementById('content');

            if (!events.length) {
                content.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">Nothing here</div>
      <div class="empty-sub">No deadlines match this filter.</div>
    </div>`;
                return;
            }

            const grouped = {};
            events.forEach(e => {
                const k = dayKey(new Date(e.date));
                (grouped[k] = grouped[k] || []).push(e);
            });

            const fmt = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
            const today = new Date(); today.setHours(0, 0, 0, 0);

            let html = '';
            Object.keys(grouped).sort().forEach(key => {
                const day = new Date(key + 'T12:00:00');
                const isToday = day.toDateString() === today.toDateString();
                const isPast = day < today;

                html += `<div class="day-group"><div class="day-label">
      ${isPast && !isToday ? '<span style="color:var(--red)">⚑</span>' : ''}
      ${fmt.format(day)}

    </div>`;

                grouped[key].forEach(e => {
                    const u = urgency(e.date);
                    const startDate = startDateOf(e);
                    const startDateObj = startDate ? new Date(startDate + 'T12:00:00') : null;
                    const startDateStr = startDateObj ? startDateObj.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) : '';
                    const endDateStr = new Date(e.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
                    const startDateDisplay = startDateObj ? `<div class="event-timeline" data-task="${esc(e.id)}">📅 ${startDateStr} → ${endDateStr}</div>` : '';
                    html += `<div class="event-card">
        <div class="urgency-bar bar-${u.cls}"></div>
        <div class="event-body">
          <div class="event-title">${esc(cleanSummary(e.summary))}</div>
          <div class="event-meta">
            <span class="badge badge-${u.cls}">${u.label}</span>
            <span class="cal-chip" style="color:${e.color};border-color:${e.color}40">${esc(e.calName)}</span>
            ${eventTime(e) ? `<span class="event-time">${eventTime(e)}</span>` : ''}
          </div>
          ${startDateDisplay}
          ${e.description ? `<div class="event-desc">${esc(e.description)}</div>` : ''}
          ${e.location ? `<div class="event-location">📍 ${esc(e.location)}</div>` : ''}
          ${effortBlock(e)}
        </div>
      </div>`;
                });

                html += '</div>';
            });

            content.innerHTML = html;
