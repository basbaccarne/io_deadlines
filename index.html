        function setView(v) {
            currentView = v;
            document.getElementById('timeline-view').style.display = v === 'timeline' ? '' : 'none';
            document.getElementById('semester-view').style.display = v === 'semester' ? '' : 'none';
            document.getElementById('workload-view').style.display = v === 'workload' ? '' : 'none';
            document.getElementById('tab-timeline').classList.toggle('active', v === 'timeline');
            document.getElementById('tab-semester').classList.toggle('active', v === 'semester');
            document.getElementById('tab-workload').classList.toggle('active', v === 'workload');
            if (v === 'semester') renderSemester();
            else if (v === 'timeline') renderTimeline();
            else if (v === 'workload') renderWorkload();
        }

        // YYYY-MM-DD in the viewer's own timezone (toISOString would use UTC and shift late-evening deadlines a day back)
        function dayKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Clock time in the viewer's timezone; the server runs in UTC
        function eventTime(e) {
            return e.allDay ? '' : new Date(e.date).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }

        function buildEventsByDay(events = allEvents) {
            const map = {};
            events.forEach(e => {
                const k = dayKey(new Date(e.date));
                (map[k] = map[k] || []).push(e);
            });
            return map;
        }

        function renderSemester() {
            const byDay = buildEventsByDay(filterEvents(eventsInYear()));
            const today = new Date(); today.setHours(0, 0, 0, 0);

            const semYear = getAcademicYear();
            const start = new Date(semYear, 8, 1);       // Sep 1
            const end = new Date(semYear + 1, 5, 30);    // Jun 30

            let html = '<div class="sem-grid">';
            const cur = new Date(start.getFullYear(), start.getMonth(), 1);
            while (cur <= end) {
                html += renderSemMonth(new Date(cur), byDay, today);
                cur.setMonth(cur.getMonth() + 1);
            }
            html += '</div>';
            document.getElementById('semester-grid').innerHTML = html;
        }

        function renderSemMonth(monthStart, byDay, today) {
            const y = monthStart.getFullYear(), mo = monthStart.getMonth();
            const title = monthStart.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
            let startDow = new Date(y, mo, 1).getDay();
            startDow = (startDow + 6) % 7; // Mon=0
            const daysInMonth = new Date(y, mo + 1, 0).getDate();

            let html = `<div class="sem-month">
                <div class="sem-month-title">${title}</div>
                <div class="sem-weekdays">${['M','T','W','T','F','S','S'].map(d => `<div class="sem-wd">${d}</div>`).join('')}</div>
                <div class="sem-days">`;

            for (let i = 0; i < startDow; i++) html += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(y, mo, day);
                const key = `${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const events = byDay[key] || [];
                const isToday = date.getTime() === today.getTime();
                const isPast = date < today && !isToday;
                const hasEvents = events.length > 0;

                let cls = 'sem-day';
                if (isToday) cls += ' is-today';
                else if (isPast) cls += ' is-past';
                if (hasEvents) cls += ' has-events';
                if (isPast && hasEvents) cls += ' is-overdue';

                // One dot per course; the dot grows with the students' estimated workload for that day
                const groups = groupByCourse(events).slice(0, 6);
                const step = groups.length > 1 ? Math.min(10, 28 / (groups.length - 1)) : 0; // px between dot centres
                const dots = groups.map((g, i) => {
                    const hours = g.events.reduce((sum, e) => sum + (effortHours(e) ?? 0), 0);
                    const size = workloadDotSize(hours);
                    const tip = `${g.calName}: ${g.events.length} item${g.events.length > 1 ? 's' : ''}`
                        + (hours ? ` · ~${Math.max(1, Math.round(hours))}h workload` : ' · no workload estimate yet');
                    return `<span class="sem-dot" style="background:${g.color};width:${size}px;height:${size}px;left:calc(50% + ${(i - (groups.length - 1) / 2) * step}px)" title="${esc(tip)}"></span>`;
                }).join('');

                const onclick = hasEvents ? `onclick="showDay('${key}')"` : '';
                html += `<div class="${cls}" ${onclick} data-date="${key}">
                    <span class="sem-day-num">${day}</span>
                    ${dots ? `<div class="sem-dots">${dots}</div>` : ''}
                </div>`;
            }

            html += '</div></div>';
            return html;
        }

        // ── Student effort estimates ──────────────────────────────────────────────
        async function loadEfforts() {
            efforts = await fetch(API + '/estimates?voter=' + encodeURIComponent(voterId))
                .then(r => r.json()).catch(() => ({}));
        }

        // Keeps the current (local) dates if the server can't answer, instead of wiping them
        async function loadStartDates() {
            try {
                const res = await fetch(API + '/start-dates');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data && typeof data === 'object' && !data.error) startDates = data;
            } catch (err) {
                console.error('Could not load start dates:', err.message);
            }
        }

        // Hand-picked short names, keyed by course code (the part before " - " in the calendar name).
        // Used instead of the automatic abbreviation below when it reads badly.
        const COURSE_SHORT_NAMES = {
            E620900A: 'Project HCD',          // Project gebruiksgericht ontwerpen
            E623400A: 'Materialen & energie', // Materialen en energie
            E623500A: 'Life cycle design',    // Life Cycle design
            E624500A: 'Design 4 sustainability', // Design for Sustainability
            E627000A: 'Sustainability project', // Design for Sustainability Project
            E629000A: 'Project adv. engineering', // Project geavanceerde engineering (3IO)
            E640970A: 'Slimme producten',     // Ontwerp van slimme producten
        };

        // Sentence case for every short name: first word capitalised, the rest lower case,
        // except acronyms and numerals (CAD, CAID, HCD, II), which stay as they are
        function sentenceCase(name) {
            return name.split(' ').map((w, i) => {
                if (/^[A-Z0-9]{2,}(-|$)/.test(w)) return w; // CAD, II, CAE-gericht
                const lower = w.toLowerCase();
                return i === 0 ? lower.charAt(0).toUpperCase() + lower.slice(1) : lower;
            }).join(' ');
        }

        function abbreviateCourse(calName) {
            const code = calName.split(' - ')[0].trim();
            return sentenceCase(COURSE_SHORT_NAMES[code] || autoAbbreviateCourse(calName));
        }

        function autoAbbreviateCourse(calName) {
            const courseName = calName.includes(' - ') ? calName.split(' - ').slice(1).join(' - ') : calName;
            
            // Special handling for courses with "vaardigheden"
            if (courseName.includes('vaardigheden')) {
                const words = courseName.split(/\s+/);
                const stopWords = new Set(['voor', 'en', 'het', 'de', 'in', 'om', 'van', 'naar', 'bij', 'door', 'als', 'met', 'aan', 'onderzoeks', 'industrieel', 'ontwerpers', 'ontwerp', 'ontwerpstrategieën']);
                const filtered = words.filter(w => !stopWords.has(w.toLowerCase()));
                
                if (filtered.length > 0) {
                    return filtered[0] + ' vaardigheden';
                }
            }
            
            const words = courseName.split(/\s+/);
            const stopWords = new Set(['voor', 'en', 'het', 'de', 'in', 'om', 'van', 'naar', 'bij', 'door', 'als', 'met', 'aan']);
            const filtered = words.filter(w => !stopWords.has(w.toLowerCase()));
            
            if (filtered.length <= 2) {
                return filtered.join(' ');
            }
            
            return filtered[0] + ' ' + filtered[filtered.length - 1];
        }

        // Start date rule: the date stored in Supabase if there is one,
        // otherwise two weeks before the deadline. Defaults are never saved.
        const DEFAULT_START_DAYS = 14;

        function hasStoredStartDate(e) {
            return !!startDates[e.id]?.startDate;
        }

        function startDateOf(e) { // → 'YYYY-MM-DD'
            if (hasStoredStartDate(e)) return startDates[e.id].startDate;
            const d = new Date(e.date);
            d.setDate(d.getDate() - DEFAULT_START_DAYS);
            // local date, not toISOString(): that would shift a day for deadlines around midnight
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function renderWorkload() {
            const events = filterEvents(eventsInYear());
            const container = document.getElementById('workload-content');

            if (!events.length) {
                container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">Nothing here</div>
      <div class="empty-sub">No deadlines match this filter.</div>
    </div>`;
                return;
            }

            // Every event has a start date (stored, or the two-week default)
            workloadEventsCache = events.map(e => ({
                event: e,
                startDate: new Date(startDateOf(e) + 'T12:00:00'),
                endDate: new Date(e.date)
            }));

            // 0. Cluster assignments with identical names AND dates
            // Group by assignment name + end date (clean summary without hours)
            const assignmentGroups = new Map();
            workloadEventsCache.forEach(ew => {
                const cleanName = cleanSummary(ew.event.summary);
                // Create a key that includes both name and end date
                const endDateStr = ew.endDate.toISOString().split('T')[0];
                const groupKey = `${cleanName}|${endDateStr}`;
                
                if (!assignmentGroups.has(groupKey)) {
                    assignmentGroups.set(groupKey, []);
                }
                assignmentGroups.get(groupKey).push(ew);
            });

            // Replace each group with a single merged entry
            const mergedCache = [];
            assignmentGroups.forEach((group, groupKey) => {
                if (group.length === 1) {
                    // Single occurrence, add as-is
                    mergedCache.push(group[0]);
                } else {
                    // Multiple occurrences with same name AND date: merge into one
                    let mergedStartDate = group[0].startDate;
                    let mergedEndDate = group[0].endDate;
                    let mergedEvent = group[0].event;

                    group.forEach(ew => {
                        if (ew.startDate < mergedStartDate) mergedStartDate = ew.startDate;
                        // Note: endDate should be the same for all in this group
                    });

                    // Validate merged dates: if start > end, clamp start to 2 weeks before end
                    if (mergedStartDate > mergedEndDate) {
                        const twoWeeksBefore = new Date(mergedEndDate);
                        twoWeeksBefore.setDate(twoWeeksBefore.getDate() - 14);
                        mergedStartDate = twoWeeksBefore;
                    }

                    mergedCache.push({
                        event: mergedEvent,
                        startDate: mergedStartDate,
                        endDate: mergedEndDate,
                        isCluster: true,
                        clusterSize: group.length
                    });
                }
            });

            workloadEventsCache = mergedCache;

            // One row per assignment, ordered by deadline (earliest first); ties by start date
            workloadEventsCache.sort((a, b) => (a.endDate - b.endDate) || (a.startDate - b.startDate));

            // Calculate academic year boundaries
            const semYear = getAcademicYear();
            const yearStart = new Date(semYear, 8, 1); // Sep 1
            const yearEnd = new Date(semYear + 1, 7, 31); // Aug 31 (52 weeks)

            // Calculate week boundaries
            const weeks = [];
            const cur = new Date(yearStart);
            cur.setDate(cur.getDate() - (cur.getDay() === 0 ? 6 : cur.getDay() - 1)); // Align to Monday
            while (cur <= yearEnd && weeks.length < 52) {
                const weekStart = new Date(cur);
                const weekEnd = new Date(cur);
                weekEnd.setDate(weekEnd.getDate() + 6);
                weeks.push({ start: weekStart, end: weekEnd, index: weeks.length });
                cur.setDate(cur.getDate() + 7);
            }

            // Clear and set up container
            container.innerHTML = '';
            container.style.overflow = 'auto';
            container.style.border = '1px solid var(--border)';
            container.style.borderRadius = '8px';
            container.style.background = 'var(--surface)';
            container.style.maxHeight = '500px';

            // D3 Gantt Chart dimensions
            // Extended right margin to accommodate labels without truncation
            const margin = { top: 40, right: 300, bottom: 20, left: 220 };
            const totalWidth = weeks.length * 80;
            const svgWidth = totalWidth + margin.left + margin.right;

            // Layout: the header and the course-name column are separate SVGs with CSS
            // position: sticky, so the browser keeps them in place while scrolling (smooth,
            // unlike moving them from a scroll handler). The drawing below keeps one shared
            // coordinate system; each SVG shows its own slice of it.
            const rowHeight = 36;
            const headerHeight = 36;
            const chartWidth = totalWidth + margin.right; // timeline + room for task names
            const bodyHeight = workloadEventsCache.length * rowHeight + margin.bottom;

            const head = d3.select(container).append('div').attr('class', 'wl-head');
            head.append('div').attr('class', 'wl-corner').style('width', margin.left + 'px');
            const headerSvg = head.append('svg').attr('width', chartWidth).attr('height', headerHeight);

            const body = d3.select(container).append('div').attr('class', 'wl-body');
            const labelsSvg = body.append('svg').attr('class', 'wl-labels')
                .attr('width', margin.left).attr('height', bodyHeight);
            const chartSvg = body.append('svg').attr('width', chartWidth).attr('height', bodyHeight);

            // Week header (sticky at the top)
            const headerGroup = headerSvg.append('g').attr('class', 'header-group')
                .attr('transform', `translate(${-margin.left}, 0)`);
            headerGroup.append('rect')
                .attr('x', 0).attr('y', 0).attr('width', svgWidth).attr('height', 36)
                .attr('fill', 'var(--surface)');

            headerGroup.selectAll('.week-header')
                .data(weeks)
                .enter()
                .append('g')
                .attr('class', 'week-header')
                .attr('transform', (d, i) => `translate(${margin.left + i * 80}, 0)`)
                .append('text')
                .attr('x', 4) // label sits at the week's Monday, where its gridline starts
                .attr('y', 25)
                .attr('text-anchor', 'start')
                .attr('font-size', '11px')
                .attr('fill', 'var(--text-3)')
                .text(d => d.start.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }));

            // Add divider line after header
            headerGroup.append('line')
                .attr('x1', margin.left)
                .attr('x2', margin.left + totalWidth)
                .attr('y1', 35)
                .attr('y2', 35)
                .attr('stroke', 'var(--border)')
                .attr('stroke-width', 1);

            // Event rows. Layers: row backgrounds, then week gridlines, then bars and task names
            const contentGroup = chartSvg.append('g').attr('transform', `translate(${-margin.left}, 0)`);
            const bgGroup = contentGroup.append('g');
            const gridGroup = contentGroup.append('g');
            const fgGroup = contentGroup.append('g');
            const labelGroup = labelsSvg.append('g'); // course names (sticky on the left)
            weeks.forEach((w, i) => gridGroup.append('line')
                .attr('x1', margin.left + i * 80).attr('x2', margin.left + i * 80)
                .attr('y1', 0).attr('y2', workloadEventsCache.length * rowHeight)
                .attr('stroke', 'var(--border)').attr('stroke-width', 1));

            workloadEventsCache.forEach((ew, rowIdx) => {
                const e = ew.event;
                const hours = effortHours(e) || 0;
                const hoursDisplay = hours ? ` · ~${Math.max(1, Math.round(hours))}h` : '';


                // Row background
                bgGroup.append('rect')
                    .attr('x', 0)
                    .attr('y', rowIdx * rowHeight)
                    .attr('width', svgWidth)
                    .attr('height', rowHeight)
                    .attr('fill', rowIdx % 2 === 0 ? 'transparent' : 'var(--surface2)')
                    .attr('opacity', 0.5);

                // Course label (left side, fixed)
                const abbrevCourse = abbreviateCourse(e.calName);
                labelGroup.append('rect')
                    .attr('x', 0)
                    .attr('y', rowIdx * rowHeight)
                    .attr('width', margin.left)
                    .attr('height', rowHeight)
                    .attr('fill', 'var(--surface)')
                    .attr('stroke', 'var(--border-subtle)')
                    .attr('stroke-width', 1);

                labelGroup.append('text')
                    .attr('x', 10)
                    .attr('y', rowIdx * rowHeight + rowHeight / 2 + 4)
                    .attr('font-size', '11px')
                    .attr('fill', e.color)
                    .style('font-weight', '500')
                    .style('cursor', 'pointer')
                    .attr('title', e.calName)
                    .text(abbrevCourse)
                    .on('click', () => showEventDetails(e));

                // Gantt bar: rounded rectangle from start date to deadline.
                // Fill opacity encodes workload (time spent); outline stays in the course colour.
                const dayPx = 80 / 7;
                const timelineStart = new Date(weeks[0].start); timelineStart.setHours(0, 0, 0, 0);
                const dayOffset = (date) => {
                    const d = new Date(date); d.setHours(0, 0, 0, 0);
                    return Math.round((d - timelineStart) / 86400000);
                };
                const maxX = margin.left + totalWidth;
                const barX1 = Math.max(margin.left, margin.left + dayOffset(ew.startDate) * dayPx);
                const barX2 = Math.min(maxX, margin.left + (dayOffset(ew.endDate) + 1) * dayPx);
                const barHeight = 22;
                const barY = rowIdx * rowHeight + (rowHeight - barHeight) / 2;
                const fillOpacity = workloadOpacity(hours);
                const strokeOpacity = workloadStrokeOpacity(hours);

                const bar = fgGroup.append('rect')
                    .attr('class', 'workload-gantt-bar')
                    .attr('x', barX1)
                    .attr('y', barY)
                    .attr('width', Math.max(barX2 - barX1, dayPx))
                    .attr('height', barHeight)
                    .attr('rx', 6)
                    .attr('ry', 6)
                    .attr('fill', e.color)
                    .attr('fill-opacity', fillOpacity)
                    .attr('stroke', e.color)
                    .attr('stroke-opacity', strokeOpacity)
                    .attr('stroke-width', 1.5)
                    .style('cursor', 'pointer')
                    .on('click', () => showEventDetails(e))
                    .on('mouseover', function() { d3.select(this).attr('fill-opacity', Math.min(1, fillOpacity + 0.15)).attr('stroke-opacity', 1).attr('stroke-width', 2); })
                    .on('mouseout', function() { d3.select(this).attr('fill-opacity', fillOpacity).attr('stroke-opacity', strokeOpacity).attr('stroke-width', 1.5); });
                bar.append('title').text(`${cleanSummary(e.summary)}${hoursDisplay || ' · no workload estimate yet'}`);

                // Event label (with cluster indicator if applicable)
                const clusterLabel = ew.isCluster && ew.clusterSize > 1 ? ` (×${ew.clusterSize})` : '';
                fgGroup.append('text')
                    .attr('x', Math.min(barX2, maxX) + 8)
                    .attr('y', rowIdx * rowHeight + rowHeight / 2 + 4)
                    .attr('font-size', '12px')
                    .attr('fill', 'var(--text)')
                    .style('cursor', 'pointer')
                    .attr('title', `${cleanSummary(e.summary)}${hoursDisplay}${clusterLabel}`)
                    .text(cleanSummary(e.summary) + hoursDisplay + clusterLabel)
                    .on('click', () => showEventDetails(e));
            });

        }

        function showEventDetails(e) {
            const u = urgency(e.date);
            const startDate = startDateOf(e);
            const startDateObj = startDate ? new Date(startDate + 'T12:00:00') : null;
            const startDateStr = startDateObj ? startDateObj.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) : '';
            const endDateStr = new Date(e.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
            const startDateDisplay = startDateObj ? `<div class="event-timeline" data-task="${esc(e.id)}">📅 ${startDateStr} → ${endDateStr}</div>` : '';

            const courseName = e.calName.includes(' - ') ? e.calName.split(' - ').slice(1).join(' - ') : e.calName;

            const modalHtml = `
      <div class="event-card">
        <div class="urgency-bar bar-${u.cls}"></div>
        <div class="event-body">
          <div class="event-title">${esc(cleanSummary(e.summary))}</div>
          <div class="event-meta">
            <span class="badge badge-${u.cls}">${u.label}</span>
            <span class="cal-chip" style="color:${e.color};border-color:${e.color}20;background-color:${e.color}08">${esc(courseName)}</span>
            ${eventTime(e) ? `<span class="event-time">${eventTime(e)}</span>` : ''}
          </div>
          ${startDateDisplay}
          ${e.description ? `<div class="event-desc">${esc(e.description)}</div>` : ''}
          ${e.location ? `<div class="event-location">📍 ${esc(e.location)}</div>` : ''}
          ${effortBlock(e)}
        </div>
      </div>`;

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.onclick = () => modal.remove();
            modal.innerHTML = `
      <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
        <div class="modal-content">
          ${modalHtml}
        </div>
      </div>`;
            document.body.appendChild(modal);
        }

        function effortPhase(e) {
            return new Date(e.endDate || e.date) < new Date() ? 'after' : 'before';
        }

        function effortStat(ph) {
            const n = ph ? ph.counts.reduce((a, b) => a + b, 0) : 0;
            if (!n) return null;
            const avg = ph.counts.reduce((sum, c, i) => sum + c * EFFORT_BUCKETS[i].mid, 0) / n;
            return { n, avg, hours: avg < 1 ? '<1h' : `~${Math.round(avg)}h` };
        }

        // Best available workload for an item: specific hours if set, else actual/expected time average
        function effortHours(e) {
            const data = efforts[e.id] || {};
            const phase = effortPhase(e);
            const specific = data[phase]?.specificHours;
            if (specific) return specific;
            return (effortStat(data.after) || effortStat(data.before))?.avg ?? null;
        }

        // 5px without estimates, growing more gradually to 16px at 25h+ (temperate scaling for less visual difference)
        function workloadDotSize(hours) {
            return hours ? Math.round(6 + 10 * Math.cbrt(Math.min(hours, 25) / 25)) : 5;
        }

        // Gantt bar fill opacity: faint without an estimate, rising to 0.85 at 25h+
        function workloadOpacity(hours) {
            if (!hours) return 0.06;
            return +(0.12 + 0.73 * Math.sqrt(Math.min(hours, 25) / 25)).toFixed(2);
        }

        // Outline opacity: wide range so workload differences read clearly.
        // 0.12 without an estimate, then from 0.2 (≈0h) to 1 at 25h+; the 0.75 power keeps
        // the low end spread out instead of bunching small loads together
        function workloadStrokeOpacity(hours) {
            if (!hours) return 0.12;
            return +(0.2 + 0.8 * Math.pow(Math.min(hours, 25) / 25, 0.75)).toFixed(2);
        }

        function effortBlock(e) {
            const phase = effortPhase(e);
            const data = efforts[e.id] || {};
            const mine = data[phase]?.mine ?? null;
            const specificHours = data[phase]?.specificHours ?? '';
            const question = phase === 'after' ? 'How long did this take you?' : 'How long do you expect this to take?';
            const stats = [['before', 'expected'], ['after', 'took']]
                .map(([p, verb]) => { const s = effortStat(data[p]); return s && `students ${verb} <strong>${s.hours}</strong> (${s.n})`; })
                .filter(Boolean).join(' · ');
            const startDate = startDateOf(e);
            const startDateStr = startDate ? new Date(startDate + 'T12:00:00').toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) : '';
            return `<div class="effort" data-task="${esc(e.id)}" data-phase="${phase}">
                <div class="effort-q">${question}</div>
                <div class="effort-btns">${EFFORT_BUCKETS.map((b, i) =>
                    `<button class="effort-btn ${mine === i ? 'mine' : ''}" data-bucket="${i}">${b.label}</button>`).join('')}</div>
                <div class="effort-specific">
                    <label>Or specify exact hours: <input type="number" step="0.5" min="0" max="500" placeholder="e.g., 2.5" class="effort-input" data-task="${esc(e.id)}" value="${specificHours}" /></label>
                </div>
                ${stats ? `<div class="effort-stats">${stats}</div>` : ''}
                <div class="start-date">
                    <label>Start date: 
                    <input type="date" class="start-date-input" data-task="${esc(e.id)}" value="${startDate}" />
                    <span class="start-date-display">${startDateStr}${hasStoredStartDate(e) ? '' : ' (default: 2 weeks before)'}</span></label>
                </div>
            </div>`;
        }

        document.addEventListener('click', async ev => {
            const btn = ev.target.closest('.effort-btn');
            if (!btn) return;
            const block = btn.closest('.effort');
            const taskId = block.dataset.task, phase = block.dataset.phase;
            const picked = +btn.dataset.bucket;

            // Clicking your current answer again removes it
            const ph = ((efforts[taskId] ||= {})[phase] ||= { counts: EFFORT_BUCKETS.map(() => 0), mine: null, specificHours: null });
            const prev = ph.mine;
            const bucket = prev === picked ? null : picked;
            if (prev !== null) ph.counts[prev]--;
            if (bucket !== null) ph.counts[bucket]++;
            ph.mine = bucket;
            refreshEffortBlocks(taskId);

            try {
                const res = await fetch(API + '/estimates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, voterId, phase, bucket })
                });
                if (!res.ok) throw new Error();
            } catch {
                await loadEfforts(); // roll back to what the server has
                refreshEffortBlocks(taskId);
            }
        });

        // ── Start dates: update the interface on every edit, save shortly after ──
        const fmtShort = dateStr => new Date(dateStr + 'T12:00:00').toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
        const startDateSaveTimers = {};

        function applyStartDateLocally(taskId, startDate, sourceInput) {
            const previous = startDates[taskId];
            startDates[taskId] = { ...(previous || {}), startDate, votes: { ...(previous?.votes || {}), [voterId]: true } };
            const e = allEvents.find(x => x.id === taskId);
            const sel = `[data-task="${CSS.escape(taskId)}"]`;
            // Every "Start date" field for this task (timeline card, pop-up): value + label, without
            // re-rendering the field being edited (that would drop focus mid-typing)
            document.querySelectorAll('.start-date-input' + sel).forEach(input => {
                if (input !== sourceInput) input.value = startDate;
                const display = input.closest('label')?.querySelector('.start-date-display');
                if (display) display.textContent = fmtShort(startDate);
            });
            // Every "📅 start → deadline" line for this task
            if (e) {
                const endStr = new Date(e.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
                document.querySelectorAll('.event-timeline' + sel).forEach(el => { el.textContent = `📅 ${fmtShort(startDate)} → ${endStr}`; });
            }
            if (currentView === 'workload') renderWorkload(); // chart sits behind the pop-up, safe to redraw
        }

        async function saveStartDate(taskId, startDate) {
            try {
                const res = await fetch(API + '/start-dates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, startDate, voterId })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
            } catch (err) {
                console.error('Failed to save start date:', err);
                alert('Could not save the start date (' + err.message + '). It is only changed in this browser tab.');
            }
        }

        document.addEventListener('input', ev => {
            const dateInput = ev.target.closest('.start-date-input');
            if (!dateInput || !dateInput.value) return; // empty while a date is half typed
            const taskId = dateInput.dataset.task, startDate = dateInput.value;
            applyStartDateLocally(taskId, startDate, dateInput);
            // Save once the user stops changing it, so typing or arrow-key stepping sends one request
            clearTimeout(startDateSaveTimers[taskId]);
            startDateSaveTimers[taskId] = setTimeout(() => saveStartDate(taskId, startDate), 600);
        });

        document.addEventListener('change', async ev => {
            const numberInput = ev.target.closest('.effort-input');
            if (numberInput) {
                const taskId = numberInput.dataset.task;
                const value = numberInput.value.trim();
                const specificHours = value ? parseFloat(value) : null;
                if (specificHours !== null && !isNaN(specificHours) && specificHours >= 0) {
                    const ph = ((efforts[taskId] ||= {})['before'] ||= { counts: EFFORT_BUCKETS.map(() => 0), mine: null, specificHours: null });
                    const phAfter = ((efforts[taskId] ||= {})['after'] ||= { counts: EFFORT_BUCKETS.map(() => 0), mine: null, specificHours: null });
                    ph.specificHours = specificHours;
                    phAfter.specificHours = specificHours;
                    // Note: specific hours are saved locally but not persisted to server (can extend if needed)
                    refreshEffortBlocks(taskId);
                }
            }
        });

        function refreshEffortBlocks(taskId) {
            const e = allEvents.find(x => x.id === taskId);
            if (!e) return;
            document.querySelectorAll(`.effort[data-task="${CSS.escape(taskId)}"]`)
                .forEach(el => { el.outerHTML = effortBlock(e); });
            if (currentView === 'semester') {
                const selected = document.querySelector('.sem-day.is-selected')?.dataset.date;
                renderSemester();
                if (selected) document.querySelector(`.sem-day[data-date="${selected}"]`)?.classList.add('is-selected');
            }
        }

        function groupByCourse(events) {
            const groups = new Map();
            events.forEach(e => {
                if (!groups.has(e.calName)) groups.set(e.calName, { calName: e.calName, color: e.color, events: [] });
                groups.get(e.calName).events.push(e);
            });
            return [...groups.values()];
        }

        function showDay(key) {
            const events = buildEventsByDay(visibleEvents())[key] || [];
            if (!events.length) return;

            const date = new Date(key + 'T12:00:00');
            const title = date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

            document.getElementById('modal-content').innerHTML =
                `<div class="modal-title">${title}</div>` +
                groupByCourse(events).flatMap(g => g.events).map(e => {
                    const u = urgency(e.date);
                    const startDate = startDateOf(e);
                    const startDateObj = startDate ? new Date(startDate + 'T12:00:00') : null;
                    const startDateStr = startDateObj ? startDateObj.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) : '';
                    const startDateDisplay = startDateObj ? `<div class="event-timeline" data-task="${esc(e.id)}">📅 ${startDateStr} → ${new Date(e.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' })}</div>` : '';
                    return `<div class="event-card" style="animation:none;margin-bottom:6px">
                        <div class="urgency-bar bar-${u.cls}"></div>
                        <div class="event-body">
                            <div class="event-title">${esc(cleanSummary(e.summary))}</div>
                            <div class="event-meta">
                                <span class="badge badge-${u.cls}">${u.label}</span>
                                <span class="cal-chip" style="color:${e.color};border-color:${e.color}40">${esc(e.calName)}</span>
                                ${eventTime(e) ? `<span class="event-time">${eventTime(e)}</span>` : ''}
                            </div>
                            ${startDateDisplay}
                            ${e.description ? `<div class="event-desc">${esc(e.description)}</div>` : ''}
                            ${effortBlock(e)}
                        </div>
                    </div>`;
                }).join('');

            document.getElementById('day-modal').style.display = 'flex';
            document.querySelectorAll('.sem-day').forEach(d => d.classList.remove('is-selected'));
            document.querySelector(`.sem-day[data-date="${key}"]`)?.classList.add('is-selected');
        }

        function closeDayModal() {
            document.getElementById('day-modal').style.display = 'none';
            document.querySelectorAll('.sem-day').forEach(d => d.classList.remove('is-selected'));
        }

        function setFilter(f) { activeFilter = f; renderFilters(); renderTimeline(); }

        function setStatus(html, isErr = false) {
            document.getElementById('load-status').innerHTML = isErr
                ? `<div class="status-err">${html}</div>`
                : `<div class="status-bar">${html}</div>`;
        }

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function cleanSummary(summary) {
            if (!summary) return '';
            return String(summary).replace(/\s*-\s*Verwacht\s*$/, '');
        }
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDayModal(); });
    </script>

    <div id="day-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeDayModal()">
        <div class="modal-box">
            <button class="modal-close" onclick="closeDayModal()">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>
</body>

</html>
